# ---------------------------------------------------------------------------
# Security scanning for self-hosted GitLab CE.
#
# Deliberately NOT built on GitLab's Security/*.gitlab-ci.yml templates.
# Dependency Scanning, Container Scanning, License Scanning and the Security
# Dashboard are Ultimate features; on CE those templates either refuse to run
# or emit reports nothing renders. Every job below drives an open-source
# scanner directly, so it behaves identically on Free.
#
# Findings surface three ways:
#   1. a readable table in each job log
#   2. raw JSON / SARIF as job artifacts
#   3. one merged Code Quality report — the only security-shaped MR widget
#      CE actually renders, so it is the one worth producing
#
# Usage, from a project's .gitlab-ci.yml:
#
#   include:
#     - project: 'john-naeder/ci-templates'
#       ref: main
#       file: '/security.gitlab-ci.yml'
#
#   stages: [scan, report]
#
# Set SECURITY_FAIL_ON (blocker | critical | major | minor | info) to make
# findings block the pipeline. Leave it empty on an existing codebase and
# tighten once the backlog is triaged — a gate nobody can turn green is a
# gate everyone learns to ignore.
# ---------------------------------------------------------------------------

variables:
  # Pinned on purpose; bump as a reviewed change, not implicitly.
  # Mirror into Harbor and swap in a digest once the runner is in-cluster.
  TRIVY_IMAGE: 'aquasec/trivy:0.58.1'
  GITLEAKS_IMAGE: 'zricethezav/gitleaks:v8.21.2'
  SEMGREP_IMAGE: 'semgrep/semgrep:1.97.0'
  PYTHON_IMAGE: 'python:3.12-alpine'

  SECURITY_FAIL_ON: ''

  TRIVY_NO_PROGRESS: 'true'
  TRIVY_CACHE_DIR: '.trivycache'
  TRIVY_TIMEOUT: '15m'
  # For an air-gapped cluster, point at a mirror:
  #   TRIVY_DB_REPOSITORY: harbor.internal/proxy/aquasec/trivy-db
  #   TRIVY_JAVA_DB_REPOSITORY: harbor.internal/proxy/aquasec/trivy-java-db

  # gitleaks reads history; a shallow clone would hide almost all of it.
  GIT_DEPTH: '0'

# ---------------------------------------------------------------------------
# Shared plumbing
# ---------------------------------------------------------------------------

.security:
  stage: scan
  interruptible: true
  artifacts:
    when: always
    expire_in: 30 days
  rules:
    - if: '$SECURITY_SCAN_DISABLED'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_COMMIT_TAG'

.trivy:
  extends: .security
  image:
    name: $TRIVY_IMAGE
    entrypoint: ['']
  cache:
    # The vulnerability DB is a few hundred MB and changes daily. Cache it per
    # branch-agnostic key so the first job of a pipeline pays for it once.
    key: 'trivy-db'
    paths:
      - .trivycache

# ---------------------------------------------------------------------------
# 1. Secret detection — working tree, then the whole history
# ---------------------------------------------------------------------------

secrets:trivy:
  extends: .trivy
  script:
    - trivy fs --scanners secret --exit-code 0 --format table .
    - trivy fs --scanners secret --exit-code 0 --format json --output trivy-secrets.json .
    # A secret in the working tree is never acceptable, whatever the gate says:
    # it is not a risk to weigh, it is a credential to revoke.
    - trivy fs --scanners secret --exit-code 1 .
  artifacts:
    when: always
    paths:
      - trivy-secrets.json

secrets:gitleaks:
  extends: .security
  image:
    name: $GITLEAKS_IMAGE
    entrypoint: ['']
  script:
    # --redact keeps the value out of the job log, which would otherwise become
    # the next place the secret leaks from.
    - |
      gitleaks detect \
        --source . \
        --redact \
        --report-format json \
        --report-path gitleaks.json \
        --exit-code 0 \
        --verbose || true
    - |
      count=$(grep -c '"RuleID"' gitleaks.json 2>/dev/null || echo 0)
      echo "gitleaks: $count finding(s) across $(git rev-list --count HEAD) commit(s)"
      if [ "$count" -gt 0 ]; then
        echo
        echo "History cannot be un-leaked by a later commit. Revoke the credential"
        echo "first, then rewrite history or record an exception in .gitleaksignore."
        exit 1
      fi
  artifacts:
    when: always
    paths:
      - gitleaks.json

# ---------------------------------------------------------------------------
# 2. Dependency scanning — lockfiles and OS packages
# ---------------------------------------------------------------------------

deps:trivy:
  extends: .trivy
  script:
    - trivy fs --scanners vuln --exit-code 0 --format table .
    - trivy fs --scanners vuln --exit-code 0 --format json --output trivy-deps.json .
    - trivy fs --scanners vuln --exit-code 0 --format sarif --output trivy-deps.sarif .
  artifacts:
    when: always
    paths:
      - trivy-deps.json
      - trivy-deps.sarif

# Trivy needs packages.lock.json to resolve NuGet, and most .NET repos do not
# commit one. The SDK already knows the graph, so ask it directly.
deps:dotnet:
  extends: .security
  image: mcr.microsoft.com/dotnet/sdk:8.0
  script:
    - dotnet restore || true
    - dotnet list package --vulnerable --include-transitive 2>&1 | tee dotnet-vulnerable.txt
    - |
      if grep -qE '> [A-Za-z0-9._-]+ +[0-9]' dotnet-vulnerable.txt; then
        echo
        echo "vulnerable NuGet packages listed above"
        if [ -n "$SECURITY_FAIL_ON" ]; then exit 1; fi
      else
        echo "no vulnerable NuGet packages"
      fi
  rules:
    - if: '$SECURITY_SCAN_DISABLED'
      when: never
    - exists:
        - '**/*.csproj'
        - '**/*.sln'
  artifacts:
    when: always
    paths:
      - dotnet-vulnerable.txt

# ---------------------------------------------------------------------------
# 3. IaC and misconfiguration — Dockerfile, Compose, Kubernetes, Helm,
#    Terraform and Ansible in one pass
# ---------------------------------------------------------------------------

iac:trivy:
  extends: .trivy
  script:
    - trivy config --exit-code 0 --format table .
    - trivy config --exit-code 0 --format json --output trivy-config.json .
  artifacts:
    when: always
    paths:
      - trivy-config.json

# ---------------------------------------------------------------------------
# 4. SAST — Semgrep OSS rules. No account, no login, no telemetry.
# ---------------------------------------------------------------------------

sast:semgrep:
  extends: .security
  image:
    name: $SEMGREP_IMAGE
    entrypoint: ['']
  variables:
    SEMGREP_SEND_METRICS: 'off'
  script:
    - semgrep scan --config auto --metrics=off --json --output semgrep.json || true
    - semgrep scan --config auto --metrics=off --sarif --output semgrep.sarif || true
    - |
      python3 - <<'PY'
      import json
      d = json.load(open("semgrep.json"))
      rs = d.get("results", [])
      errs = [r for r in rs if r.get("extra", {}).get("severity") == "ERROR"]
      print(f"semgrep: {len(rs)} finding(s), {len(errs)} at ERROR severity")
      for r in sorted(rs, key=lambda r: r.get("path", ""))[:50]:
          e = r.get("extra", {})
          print(f"  {e.get('severity','?'):8} {r.get('path')}:{r.get('start',{}).get('line')}  {r.get('check_id')}")
      PY
  artifacts:
    when: always
    paths:
      - semgrep.json
      - semgrep.sarif

# ---------------------------------------------------------------------------
# 5. Container scanning — opt in by setting SCAN_IMAGE to a built tag
# ---------------------------------------------------------------------------

container:trivy:
  extends: .trivy
  script:
    - trivy image --exit-code 0 --format table "$SCAN_IMAGE"
    - trivy image --exit-code 0 --format json --output trivy-image.json "$SCAN_IMAGE"
  rules:
    - if: '$SECURITY_SCAN_DISABLED'
      when: never
    - if: '$SCAN_IMAGE'
  artifacts:
    when: always
    paths:
      - trivy-image.json

# ---------------------------------------------------------------------------
# 6. Merge everything into the one report CE renders
#
# Kept as a single job rather than one report per scanner, because the scanner
# images carry no shared JSON tooling and Code Quality is easier to reason
# about when one place decides severity and de-duplication.
# ---------------------------------------------------------------------------

report:codequality:
  stage: report
  image: $PYTHON_IMAGE
  needs:
    - job: secrets:trivy
      artifacts: true
      optional: true
    - job: secrets:gitleaks
      artifacts: true
      optional: true
    - job: deps:trivy
      artifacts: true
      optional: true
    # Thiếu dòng này thì report chạy trước khi deps:dotnet xong, và phát hiện
    # của nó không bao giờ tới được diff của merge request — job vẫn xanh, chỉ
    # là kết quả rơi vào hư không.
    - job: deps:dotnet
      artifacts: true
      optional: true
    - job: iac:trivy
      artifacts: true
      optional: true
    - job: sast:semgrep
      artifacts: true
      optional: true
    - job: container:trivy
      artifacts: true
      optional: true
  script:
    - !reference [.codequality_converter, script]
    - python3 to-codequality.py
  rules:
    - if: '$SECURITY_SCAN_DISABLED'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: always
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: always
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: always
    - if: '$CI_COMMIT_TAG'
      when: always
  artifacts:
    when: always
    expire_in: 30 days
    reports:
      codequality: gl-code-quality-report.json
    paths:
      - gl-code-quality-report.json

# ---------------------------------------------------------------------------
# The converter, inlined so this template is includable on its own with no
# companion checkout. Generated from scripts/to-codequality.py in the
# ci-templates repo — edit there and re-run scripts/sync-template.py.
# ---------------------------------------------------------------------------

.codequality_converter:
  script:
    - |
      cat > to-codequality.py <<'PYEOF'
      #!/usr/bin/env python3
      """
      Convert scanner output into a single GitLab Code Quality report.

      Why Code Quality and not the SAST / Dependency Scanning report formats: those
      are rendered only by GitLab Ultimate. Code Quality is available on CE Free and
      shows up inline in the merge request diff, which makes it the only way to put
      security findings in front of a reviewer on a self-hosted CE instance.

      Reads whichever of these exist in the working directory and merges them:

          trivy-*.json     Trivy JSON  (vulnerabilities, misconfigurations, secrets)
          semgrep.json     Semgrep JSON
          gitleaks.json    Gitleaks JSON

      Writes gl-code-quality-report.json, and exits non-zero if any finding is at or
      above the severity named by SECURITY_FAIL_ON (empty = never fail).
      """
      from __future__ import annotations

      import glob
      import hashlib
      import json
      import os
      import sys

      # GitLab Code Quality severities, ordered from worst to least bad.
      ORDER = ["blocker", "critical", "major", "minor", "info"]

      TRIVY_SEVERITY = {
          "CRITICAL": "blocker",
          "HIGH": "critical",
          "MEDIUM": "major",
          "LOW": "minor",
          "UNKNOWN": "info",
      }
      SEMGREP_SEVERITY = {"ERROR": "critical", "WARNING": "major", "INFO": "minor"}


      def fingerprint(*parts: object) -> str:
          """Stable across runs so GitLab can tell a new finding from an old one."""
          return hashlib.sha256("|".join(str(p) for p in parts).encode()).hexdigest()


      def issue(description, check_name, severity, path, line, fp) -> dict:
          return {
              "type": "issue",
              "description": description,
              "check_name": check_name,
              "severity": severity,
              "fingerprint": fp,
              "location": {"path": path, "lines": {"begin": max(1, int(line or 1))}},
          }


      def load(path: str):
          try:
              with open(path, encoding="utf-8") as fh:
                  return json.load(fh)
          except (OSError, json.JSONDecodeError) as exc:
              print(f"  skipping {path}: {exc}", file=sys.stderr)
              return None


      def from_trivy(doc) -> list[dict]:
          out = []
          for result in (doc or {}).get("Results") or []:
              target = result.get("Target") or "unknown"

              for v in result.get("Vulnerabilities") or []:
                  fix = (
                      f" (fixed in {v['FixedVersion']})"
                      if v.get("FixedVersion")
                      else " (no fix available)"
                  )
                  out.append(
                      issue(
                          f"{v.get('VulnerabilityID')}: {v.get('PkgName')} "
                          f"{v.get('InstalledVersion')} — {v.get('Title') or 'no title'}{fix}",
                          v.get("VulnerabilityID", "trivy-vuln"),
                          TRIVY_SEVERITY.get(v.get("Severity", "UNKNOWN"), "info"),
                          target,
                          1,
                          fingerprint(target, v.get("VulnerabilityID"), v.get("PkgName"),
                                      v.get("InstalledVersion")),
                      )
                  )

              for m in result.get("Misconfigurations") or []:
                  line = (m.get("CauseMetadata") or {}).get("StartLine") or 1
                  out.append(
                      issue(
                          f"{m.get('ID')}: {m.get('Title')} — {m.get('Message')}",
                          m.get("ID", "trivy-config"),
                          TRIVY_SEVERITY.get(m.get("Severity", "UNKNOWN"), "info"),
                          target,
                          line,
                          fingerprint(target, m.get("ID"), line),
                      )
                  )

              # A secret in the tree has no "wait for a fix" state, only "revoke it".
              for s in result.get("Secrets") or []:
                  out.append(
                      issue(
                          f"secret detected: {s.get('Title')} ({s.get('RuleID')})",
                          s.get("RuleID", "trivy-secret"),
                          "blocker",
                          target,
                          s.get("StartLine") or 1,
                          fingerprint(target, s.get("RuleID"), s.get("StartLine")),
                      )
                  )
          return out


      def from_semgrep(doc) -> list[dict]:
          out = []
          for r in (doc or {}).get("results") or []:
              extra = r.get("extra") or {}
              path = r.get("path") or "unknown"
              line = (r.get("start") or {}).get("line") or 1
              out.append(
                  issue(
                      f"{r.get('check_id')}: {extra.get('message', '').strip()}",
                      r.get("check_id", "semgrep"),
                      SEMGREP_SEVERITY.get(extra.get("severity", "INFO"), "info"),
                      path,
                      line,
                      fingerprint(path, r.get("check_id"), line),
                  )
              )
          return out


      def from_gitleaks(doc) -> list[dict]:
          out = []
          for f in doc or []:
              commit = (f.get("Commit") or "")[:8]
              path = f.get("File") or "unknown"
              line = f.get("StartLine") or 1
              out.append(
                  issue(
                      f"secret in history: {f.get('Description')} — commit {commit} "
                      f"by {f.get('Author', 'unknown')}",
                      f.get("RuleID", "gitleaks"),
                      "blocker",
                      path,
                      line,
                      fingerprint(path, f.get("RuleID"), f.get("Commit"), line),
                  )
              )
          return out


      def main() -> int:
          findings: list[dict] = []
          seen: set[str] = set()

          sources = [(p, from_trivy) for p in sorted(glob.glob("trivy-*.json"))]
          sources += [("semgrep.json", from_semgrep), ("gitleaks.json", from_gitleaks)]

          for path, parser in sources:
              if not os.path.exists(path):
                  continue
              doc = load(path)
              if doc is None:
                  continue
              produced = parser(doc)
              print(f"  {path}: {len(produced)} finding(s)")
              for f in produced:
                  if f["fingerprint"] in seen:
                      continue
                  seen.add(f["fingerprint"])
                  findings.append(f)

          findings.sort(key=lambda f: (ORDER.index(f["severity"]), f["location"]["path"]))

          with open("gl-code-quality-report.json", "w", encoding="utf-8") as fh:
              json.dump(findings, fh, indent=2)

          counts = {s: sum(1 for f in findings if f["severity"] == s) for s in ORDER}
          print("\ntotal: " + ", ".join(f"{n} {s}" for s, n in counts.items() if n))
          print(f"wrote gl-code-quality-report.json ({len(findings)} finding(s))")

          gate = (os.environ.get("SECURITY_FAIL_ON") or "").strip().lower()
          if not gate:
              return 0
          if gate not in ORDER:
              print(f"SECURITY_FAIL_ON={gate!r} is not one of {ORDER}", file=sys.stderr)
              return 2
          limit = ORDER.index(gate)
          blocking = [f for f in findings if ORDER.index(f["severity"]) <= limit]
          if blocking:
              print(f"\n{len(blocking)} finding(s) at or above '{gate}':")
              for f in blocking[:40]:
                  loc = f["location"]
                  print(f"  {f['severity']:8} {loc['path']}:{loc['lines']['begin']}  {f['check_name']}")
              return 1
          return 0


      if __name__ == "__main__":
          sys.exit(main())
      PYEOF
